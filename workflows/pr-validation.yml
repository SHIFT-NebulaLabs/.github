name: Validate PR Source Branch

on:
  pull_request:
    branches:
      - main

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR comes from dev branch
        if: github.head_ref != 'dev'
        run: |
          echo "::error::❌ Pull Requests to 'main' must come ONLY from 'dev' branch"
          echo "::error::Your source branch is: ${{ github.head_ref }}"
          echo "::error::Please merge your branch into 'dev' first, then create a PR from 'dev' to 'main'"
          exit 1
      
      - name: PR validation passed
        if: github.head_ref == 'dev'
        run: |
          echo "✅ Valid Pull Request: comes from 'dev' branch"
          echo "✅ You can proceed with the merge"